_format_version: "3.0"
# Configuracao declarativa do Portal (ARQ-01: "Portal — gateway: TLS,
# autenticacao de borda, quotas tecnicas, rotas, limites de payload").
# TLS termina no proxy/gateway do ambiente. A autenticação OIDC é validada
# novamente por cada serviço Go; o gateway não é a única autoridade. Headers de
# identidade fornecidos pelo cliente não são usados pelos domínios.

services:
  - name: orbita
    url: http://orbita:8080
    routes:
      - name: orbita-protocols
        paths:
          - /v1/protocols
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: atlas
    url: http://atlas:8081
    routes:
      - name: atlas-admin
        paths:
          - /admin/atlas
        strip_path: true
