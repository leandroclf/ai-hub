server {
  listen 8080;
  root /usr/share/nginx/html;
  # O Docker atribui novo IP ao serviço quando ele é recriado. Resolver no
  # DNS interno a cada janela curta evita que o portal retenha um upstream
  # obsoleto após uma troca controlada de container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location / { try_files $uri $uri/ /index.html; }
  set $atlas_upstream atlas:8081;
  set $orbita_upstream orbita:8080;
  set $cometa_upstream cometa:8082;
  set $pulsar_upstream pulsar:8083;
  set $libra_upstream libra:8084;
  location /api/atlas/ { rewrite ^/api/atlas/(.*)$ /$1 break; proxy_pass http://$atlas_upstream; }
  location /api/orbita/ { rewrite ^/api/orbita/(.*)$ /$1 break; proxy_pass http://$orbita_upstream; }
  location /api/cometa/ { rewrite ^/api/cometa/(.*)$ /$1 break; proxy_pass http://$cometa_upstream; }
  location /api/pulsar/ { rewrite ^/api/pulsar/(.*)$ /$1 break; proxy_pass http://$pulsar_upstream; }
  location /api/libra/ { rewrite ^/api/libra/(.*)$ /$1 break; proxy_pass http://$libra_upstream; }
}
