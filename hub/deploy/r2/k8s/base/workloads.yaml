---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pulsar
spec:
  scaleTargetRef:
    name: pulsar
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 2
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: postgresql
    metadata:
      connectionFromEnv: CORE_DSN
      query: SELECT count(*) FROM deliveries WHERE state IN ('PENDING','RETRY_SCHEDULED') AND next_attempt_at <= now()
      targetQueryValue: '10'
---
