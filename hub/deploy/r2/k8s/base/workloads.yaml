apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  labels: &id001
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: ai-hub
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
      containers:
      - name: atlas
        image: ai-hub-r2-atlas:r2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: HTTP_ADDR
          value: :8081
        - name: OTEL_SERVICE_NAME
          value: atlas
        - name: WORKLOAD_CLIENT_ID
          value: hub-atlas
        - name: WORKLOAD_CLIENT_SECRET_FILE
          value: /run/workload/client-secret
        - name: CONTROL_DSN
          valueFrom:
            secretKeyRef:
              name: hub-runtime
              key: CONTROL_DSN
        envFrom:
        - configMapRef:
            name: hub-runtime
        volumeMounts:
        - name: workload
          mountPath: /run/workload
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz/startup
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: workload
        secret:
          secretName: atlas-workload
---
apiVersion: v1
kind: Service
metadata:
  name: atlas
spec:
  selector:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: ai-hub
  ports:
  - name: http
    port: 8081
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/part-of: ai-hub
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
