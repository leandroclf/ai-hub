apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-hub-hom
resources:
- ../../base
replicas:
- name: atlas
  count: 2
- name: orbita
  count: 2
- name: cometa
  count: 2
- name: pulsar
  count: 2
- name: libra
  count: 2
patches:
- target:
    kind: HorizontalPodAutoscaler
    name: atlas
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 2\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 4\n"
- target:
    kind: HorizontalPodAutoscaler
    name: orbita
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 2\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 4\n"
- target:
    kind: HorizontalPodAutoscaler
    name: cometa
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 2\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 4\n"
- target:
    kind: HorizontalPodAutoscaler
    name: libra
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 2\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 4\n"
- target:
    kind: ScaledObject
    name: pulsar
  patch: "- op: replace\n  path: /spec/minReplicaCount\n  value: 2\n- op: replace\n\
    \  path: /spec/maxReplicaCount\n  value: 4\n"
