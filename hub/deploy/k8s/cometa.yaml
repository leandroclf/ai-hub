# Manifest de REFERENCIA para o Cometa (controlador adaptativo AIMD e
# despacho a provedores externos, porta 8082). Atende tanto chamada
# sincrona direta da Orbita (SELF_URL, OPE-09) quanto consumo de fila
# (ASYNC/QUEUED).
#
# NAO APLICADO a nenhum cluster real (ver hub/deploy/k8s/README.md).
#
# OPE-05: "HPA para APIs, KEDA para workers de fila (um controlador de
# escala por Deployment, sem HPA paralelo concorrente)". O Cometa
# consome fila (QUEUE_ENDPOINT) e tem backlog/idade de obrigacao como
# sinal de escala mais relevante que CPU/memoria isolados -> classificado
# aqui como worker: NENHUM HorizontalPodAutoscaler eh declarado para
# este Deployment. Em ppd/prd, o controlador de escala seria um KEDA
# ScaledObject (ver pulsar.yaml para um exemplo comentado do padrao;
# nao duplicado aqui para evitar redundancia) apontando para backlog de
# fila/idade de operacao pendente, nunca HPA e KEDA simultaneos sobre o
# mesmo Deployment.

apiVersion: v1
kind: ConfigMap
metadata:
  name: cometa-config
  labels:
    app.kubernetes.io/name: cometa
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
data:
  HTTP_ADDR: ":8082"
  SELF_URL: "http://cometa:8082"
  ATLAS_URL: "http://atlas:8081"
  # PLACEHOLDER: ver nota equivalente em orbita.yaml sobre QUEUE_ENDPOINT
  # em ambientes gerenciados (P-01).
  QUEUE_ENDPOINT: "http://localstack.hub-local.svc.cluster.local:4566"
  QUEUE_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: cometa-secret
  labels:
    app.kubernetes.io/name: cometa
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  CORE_DSN: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/hub_core?sslmode=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cometa
  labels:
    app.kubernetes.io/name: cometa
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  replicas: 3 # OPE-04: minimo de 3 em ppd/prd, distribuidas em 3 zonas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cometa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cometa
        app.kubernetes.io/part-of: hub-interoperabilidade
        app.kubernetes.io/component: worker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cometa
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cometa
      # OPE-05: drenagem graciosa preserva UNKNOWN em chamada externa em
      # andamento em vez de declarar sucesso/falha sem confirmacao; o
      # prazo deve superar a drenagem homologada (valor de referencia).
      terminationGracePeriodSeconds: 30
      containers:
        - name: cometa
          # PLACEHOLDER: registry/tag reais dependem de P-01.
          image: "<registry-placeholder>/hub-cometa:<tag-placeholder>"
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: cometa-config
            - secretRef:
                name: cometa-secret
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
            successThreshold: 1
          resources:
            # PLACEHOLDER de referencia - a qualificar por perfil de carga
            # real (P-02), incluindo concorrencia HTTP por provedor/conta
            # do controlador AIMD (OPE-07).
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cometa
  labels:
    app.kubernetes.io/name: cometa
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cometa
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cometa
  labels:
    app.kubernetes.io/name: cometa
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cometa
