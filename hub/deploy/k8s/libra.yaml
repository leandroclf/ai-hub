# Manifest de REFERENCIA para o Libra (apuracao/reservas financeiras
# pos-pagas, banco proprio hub_finance, porta 8084). Worker de fila.
#
# NAO APLICADO a nenhum cluster real (ver hub/deploy/k8s/README.md). Ver
# atlas.yaml para as referencias completas de OPE-04/OPE-05; ver
# cometa.yaml para a justificativa HPA-vs-KEDA (OPE-05/OPE-12): assim
# como Cometa, nenhum HorizontalPodAutoscaler eh declarado aqui - em
# ppd/prd o controlador de escala seria um KEDA ScaledObject por
# backlog/idade de fato financeiro pendente (ver pulsar.yaml para o
# padrao de exemplo, nao duplicado aqui).

apiVersion: v1
kind: ConfigMap
metadata:
  name: libra-config
  labels:
    app.kubernetes.io/name: libra
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
data:
  HTTP_ADDR: ":8084"
  ATLAS_URL: "http://atlas:8081"
  # PLACEHOLDER: ver nota equivalente em orbita.yaml sobre QUEUE_ENDPOINT
  # em ambientes gerenciados (P-01).
  QUEUE_ENDPOINT: "http://localstack.hub-local.svc.cluster.local:4566"
  QUEUE_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: libra-secret
  labels:
    app.kubernetes.io/name: libra
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  # PLACEHOLDER: banco financeiro proprio (hub_finance) - isolamento
  # reforca OPE-13 (banco financeiro indisponivel nao deve afetar outros
  # bancos). Nunca versionar valor real; popular via secret manager (P-01).
  FINANCE_DSN: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/hub_finance?sslmode=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libra
  labels:
    app.kubernetes.io/name: libra
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  replicas: 3 # OPE-04: minimo de 3 em ppd/prd, distribuidas em 3 zonas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: libra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libra
        app.kubernetes.io/part-of: hub-interoperabilidade
        app.kubernetes.io/component: worker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: libra
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: libra
      # OPE-05/OPE-11: drenagem graciosa preserva fatos financeiros em
      # voo em vez de declarar sucesso/perda sem confirmacao.
      terminationGracePeriodSeconds: 30
      containers:
        - name: libra
          # PLACEHOLDER: registry/tag reais dependem de P-01.
          image: "<registry-placeholder>/hub-libra:<tag-placeholder>"
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: libra-config
            - secretRef:
                name: libra-secret
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
            successThreshold: 1
          resources:
            # PLACEHOLDER de referencia - a qualificar por perfil de carga
            # real (P-02).
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: libra
  labels:
    app.kubernetes.io/name: libra
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: libra
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: libra
  labels:
    app.kubernetes.io/name: libra
    app.kubernetes.io/part-of: hub-interoperabilidade
    app.kubernetes.io/component: worker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: libra
