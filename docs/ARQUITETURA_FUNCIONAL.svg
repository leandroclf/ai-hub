final</text><rect x="80" y="579" width="365" height="139" rx="12" fill="#edf3fc" stroke="#bcd1de" stroke-width="1.5"/><text x="100" y="611" class="box-title">SNS / SQS</text><text x="100" y="640" class="body">Trabalho ASYNC e fatos</text><text x="100" y="665" class="body">Cometa / Órbita publicam</text><text x="100" y="690" class="body">Órbita / Pulsar / Libra consomem</text><path d="M650 495 H611 V552 H264 V572" class="edge dash"/><text x="315" y="544" class="label">ASYNC</text><path d="M445 611 H643" class="edge dash"/><text x="493" y="600" class="label">comando</text><path d="M650 674 H452" class="edge dash"/><text x="501" y="664" class="label">fatos</text><rect x="80" y="774" width="165" height="108" rx="12" fill="#edf3fc" stroke="#bcd1de" stroke-width="1.5"/><text x="100" y="806" class="box-title">Pulsar · Go</text><text x="100" y="835" class="body">Webhook do</text><text x="100" y="860" class="body">mesmo final</text><rect x="280" y="774" width="165" height="108" rx="12" fill="#edf3fc" stroke="#bcd1de" stroke-width="1.5"/><text x="300" y="806" class="box-title">Libra · Go</text><text x="300" y="835" class="body">Uso, custo</text><text x="300" y="860" class="body">e receita</text><path d="M161 718 V767" class="edge"/><path d="M362 718 V767" class="edge"/><rect x="650" y="774" width="445" height="108" rx="12" fill="#fff" stroke="#bcd1de" stroke-width="1.5"/><text x="670" y="806" class="box-title">Provedor / conta autorizada</text><text x="670" y="835" class="body">SHARED_HUB ou TENANT_DEDICATED</text><text x="670" y="860" class="body">TTL + SLA + limites por capacidade</text><path d="M866 697 V767" class="edge"/><text x="881" y="741" class="label">chamada externa</text><text x="80" y="934" class="body">GET e webhook usam a representação final conservada; consulta não aciona o provedor.</text><rect x="40" y="994" width="1120" height="249" rx="16" fill="white" stroke="#d4e2e9"/><text x="65" y="1029" class="kicker">CUSTÓDIA E DEPENDÊNCIAS · AUTORIDADE POR DOMÍNIO</text><rect x="65" y="1049" width="515" height="90" rx="12" fill="#fff" stroke="#bcd1de" stroke-width="1.5"/><text x="85" y="1081" class="box-title">PostgreSQL core · multi-AZ</text><text x="85" y="1110" class="body">Órbita / Cometa / Pulsar: schemas próprios</text><rect x="605" y="1049" width="530" height="90" rx="12" fill="#fff" stroke="#bcd1de" stroke-width="1.5"/><text x="625" y="1081" class="box-title">PostgreSQL financeiro · multi-AZ</text><text x="625" y="1110" class="body">Libra: reservas, fatos, ledger e conciliação</text><text x="65" y="1172" class="body">S3: objetos íntegros · Secrets Manager/KMS: segredos versionados</text><text x="65" y="1206" class="body">Redis: cache opcional com bypass · nenhuma informação crítica exclusiva</text><rect x="40" y="1263" width="1120" height="87" rx="12" fill="#dfeef2"/><text x="65" y="1297" class="body">OpenTelemetry / Tempo · Prometheus · Loki / Alloy · Grafana</text><text x="65" y="1327" class="small">Persistir antes de confirmar. Sem autoridade durável, restringir novos efeitos e preservar obrigações.</text><text x="45" y="1375" class="small">Visão funcional documental. Detalhes de transporte, fallback e domínio de falhas nos capítulos 02, 03, 04 e 07.</text></svg>