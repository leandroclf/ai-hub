<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="title desc">
<title id="title">Hub Constelação — arquitetura funcional v4</title>
<desc id="desc">Execução síncrona direta e assíncrona por filas, sobre estado durável comum. Controle de credenciais, expansão automática e persistência por domínio.</desc>
